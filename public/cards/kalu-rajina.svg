    <path id="kr-spade" d="M50 0 C50 0 0 45 0 70 C0 90 20 100 38 92 C34 105 28 115 20 122 L80 122 C72 115 66 105 62 92 C80 100 100 90 100 70 C100 45 50 0 50 0 Z"/>
